[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leocode"
version = "1.0.0"
description = "Professional AI coding agent powered by 9Router"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "rich>=13.0.0",
    "pyperclip>=1.8.0",
    "watchdog>=4.0.0",
    "aiofiles>=24.0.0",

]

[project.scripts]
leocode = "leocode.__main__:main"

[tool.setuptools.packages.find]
include = ["leocode*"]
